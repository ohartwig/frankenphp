services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Koh\FrankenPHP\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Cache/*'
      - '../Classes/Domain/Model/*'
      - '../Classes/Fluid/MemoizingTemplatePaths.php'
      - '../Classes/Fluid/TemplatePathMemo.php'
      - '../Classes/Message/*'
      - '../Classes/Runtime/*'

  # KOH_WORKER_TEMPLATE_PATH_MEMO: Fluid file lookups remembered per worker.
  # A pass-through while the switch is off; see TemplatePathMemo.
  Koh\FrankenPHP\Fluid\TemplatePathMemoViewFactory:
    decorates: TYPO3\CMS\Core\View\ViewFactoryInterface
    arguments:
      $inner: '@.inner'

  # KOH_LAZY_PAGE_LAYOUT: a page's backend layout resolved on first use, not
  # for every request. TYPO3's resolver unchanged while the switch is off; see
  # LazyPageLayoutResolver.
  TYPO3\CMS\Core\Page\PageLayoutResolver:
    class: Koh\FrankenPHP\Page\LazyPageLayoutResolver
    public: true

  Koh\FrankenPHP\EventListener\SystemInformationToolbar:
    tags: { name: event.listener }

  Koh\FrankenPHP\EventListener\CacheInvalidationListener:
    tags:
      - name: event.listener
        identifier: 'caddy-cache-general-flush'
        method: 'onGeneralCacheFlush'
        event: TYPO3\CMS\Core\Cache\Event\CacheFlushEvent

